name: Publish rc14 tag once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-rc14-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Point rc14 tag at the verified release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.26.0-rc14" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.26.0-rc14"               -f sha="$GITHUB_SHA"               -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"               -f ref='refs/tags/v0.26.0-rc14'               -f sha="$GITHUB_SHA"
          fi

      - name: Dispatch signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v0.26.0-rc14
