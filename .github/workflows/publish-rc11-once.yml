name: Publish rc11 tag once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-rc11-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Point rc11 tag at the final release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.26.0-rc11" \
            -f sha="$GITHUB_SHA" \
            -F force=true

      - name: Dispatch signed release workflow on rc11 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v0.26.0-rc11
