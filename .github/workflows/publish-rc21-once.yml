name: Publish rc21 once

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-rc21-once.yml"]

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.added, '.github/workflows/publish-rc21-once.yml')
    runs-on: ubuntu-latest
    steps:
      - name: Create rc21 tag and dispatch signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.26.0-rc21
        run: |
          set -euo pipefail
          release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[0].sha')
          test -n "$release_sha"
          ref="refs/tags/$RELEASE_TAG"
          existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$existing_sha" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=$ref" -f "sha=$release_sha"
          else
            test "$existing_sha" = "$release_sha"
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"

      - name: Remove the one-time publisher
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_PATH: .github/workflows/publish-rc21-once.yml
        run: |
          set -euo pipefail
          file_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$PUBLISHER_PATH?ref=main" --jq '.sha')
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$PUBLISHER_PATH" \
            -f "message=Remove one-time rc21 publisher" \
            -f "sha=$file_sha" \
            -f "branch=main"
