name: Publish signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release readiness metadata
        run: python3 scripts/verify_release_readiness.py

      - name: Verify tag matches app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          test "v$version" = "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare pinned bundled extensions
        run: |
          python3 scripts/prepare_ublock.py
          python3 scripts/prepare_darkreader.py

      - name: Prepare permanent release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ILYRO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ILYRO_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ILYRO_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ILYRO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing required GitHub Secret: $variable"
              exit 1
            fi
          done

          python3 - <<'PY'
          import base64
          import binascii
          import hashlib
          import os
          import sys
          import unicodedata

          raw = os.environ["RELEASE_KEYSTORE_BASE64"]
          expected_b64_length = 5076
          expected_sha256 = "5f3810a5ca96136c71c089f7b95390aa97f6065b1f7741182a6af35bdf3bdad0"
          allowed = frozenset("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          cleaned = "".join(ch for ch in raw if not ch.isspace() and unicodedata.category(ch) != "Cf")
          candidate = "".join(ch for ch in cleaned if ch in allowed)
          candidates = [candidate]
          marker_index = candidate.find("/u3+")
          if marker_index >= 0 and len(candidate) >= marker_index + expected_b64_length:
              candidates.insert(0, candidate[marker_index:marker_index + expected_b64_length])

          decoded = None
          for value in candidates:
              try:
                  data = base64.b64decode(value, validate=True)
              except (binascii.Error, ValueError):
                  continue
              if hashlib.sha256(data).hexdigest() == expected_sha256:
                  decoded = data
                  break

          if decoded is None:
              print("::error::Release keystore does not match the permanent ILYRO key.")
              sys.exit(1)

          path = os.path.join(os.environ["RUNNER_TEMP"], "ilyro-release.jks")
          with open(path, "wb") as handle:
              handle.write(decoded)
          os.chmod(path, 0o600)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ILYRO_RELEASE_STORE_FILE={path}\n")
              env_file.write(f"ILYRO_RELEASE_STORE_PASSWORD={os.environ['RELEASE_STORE_PASSWORD']}\n")
              env_file.write(f"ILYRO_RELEASE_KEY_ALIAS={os.environ['RELEASE_KEY_ALIAS']}\n")
              env_file.write(f"ILYRO_RELEASE_KEY_PASSWORD={os.environ['RELEASE_KEY_PASSWORD']}\n")
          PY

      - name: Test and build release APK
        run: |
          ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace

      - name: Verify release signature and bundled protection
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -Fi "c3d911a2e736a4c5ab855d97f3970158633f02d9321674d4702f7d2eb238068f" /tmp/apksigner.txt
          unzip -l "$APK" | grep -F "assets/ilyro-adblock/manifest.json"
          unzip -l "$APK" | grep -F "assets/ilyro-darkreader/manifest.json"

      - name: Create release files
        run: |
          set -euo pipefail
          mkdir -p dist
          name="ILYRO-${{ steps.version.outputs.version }}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$name"
          cp LICENSE dist/LICENSE
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          (cd dist && sha256sum "$name" > "$name.sha256")
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > dist/release-dependencies.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ILYRO-${{ steps.version.outputs.version }}-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "ILYRO $RELEASE_VERSION" "${release_flags[@]}"
          fi
