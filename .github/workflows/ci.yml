name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare pinned bundled extensions
        run: |
          python3 scripts/prepare_ublock.py
          python3 scripts/prepare_darkreader.py

      - name: Validate helper JavaScript
        run: |
          node --check app/src/main/assets/media-fullscreen/gesture-policy.js
          node --check app/src/main/assets/media-fullscreen/gestures.js
          node --check app/src/main/assets/media-fullscreen/fullscreen.js
          node --check app/src/main/assets/media-detector/detector.js
          node --check app/src/main/ubo/ilyro-native-bridge.js
          node app/src/test/js/gesture-policy.test.js

      - name: Verify release readiness metadata
        run: python3 scripts/verify_release_readiness.py

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug --stacktrace
          lint_status=$?
          lint_report="$(find app/build -type f -name 'lint-results-debug.txt' -print -quit)"
          if [ -n "$lint_report" ]; then
            echo "::group::Android lint report"
            cat "$lint_report"
            echo "::endgroup::"
          fi
          exit "$lint_status"

      - name: Test and build debug APK
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ILYRO-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
